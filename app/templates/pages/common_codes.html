{% extends "layout.html" %}
{% block title %}공통코드 등록 - 재고조사 시스템{% endblock %}
{% block content %}
<h1 class="page-title">공통코드 등록</h1>

<div class="panel">
  <div class="panel-title">그룹 선택</div>
  <div class="search-bar" id="group-tabs"></div>
</div>

<div class="panel">
  <div class="panel-title">코드 추가</div>
  <form id="code-form" class="form-grid">
    <div class="form-field">
      <label for="code-input">코드</label>
      <input id="code-input" name="code" required maxlength="30">
    </div>
    <div class="form-field">
      <label for="name-input">이름</label>
      <input id="name-input" name="name" required maxlength="50">
    </div>
    <div class="form-field">
      <label for="sort-order-input">정렬순서</label>
      <input id="sort-order-input" name="sort_order" type="number" value="0">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">추가</button>
    </div>
  </form>
</div>

<div class="panel">
  <div class="panel-title">코드 목록</div>
  <div class="search-bar">
    <input id="keyword-input" type="text" placeholder="이름으로 검색">
  </div>
  <div class="table-scroll">
  <table class="data-table">
    <thead>
      <tr>
        <th>코드</th>
        <th>이름</th>
        <th>정렬순서</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="code-table-body"></tbody>
  </table>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/common_codes.js?v={{ asset_version }}"></script>
{% endblock %}
